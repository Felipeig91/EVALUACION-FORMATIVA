<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex - Talentos Portal Escolar</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="pokemon-style.css" />
  </head>
  <body>
    <!-- NAVBAR CONTAINER - Se carga automáticamente -->
    <div id="navbar-container"></div>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/load-navbar.js"></script>

    <!-- POKÉDEX CONTENT -->
    <div class="container" style="margin-top: 40px; margin-bottom: 40px">
      <h1>Pokédex</h1>

      <div class="search-section">
        <input
          type="text"
          id="pokemonInput"
          placeholder="Busca un Pokémon por nombre o ID..."
        />
        <button id="searchBtn">Buscar</button>
      </div>

      <div id="error" class="error"></div>

      <div id="loading" class="loading" style="display: none">
        <p>Cargando...</p>
        <p style="font-size: 0.9em; margin-top: 10px">
          Si este mensaje persiste, abre la consola del navegador (F12) para ver
          más detalles
        </p>
      </div>

      <div id="pokemonCard" class="pokemon-card" style="display: none">
        <div class="card-content">
          <img id="pokemonImage" src="" alt="Pokémon" />
          <h2 id="pokemonName"></h2>

          <div class="pokemon-info">
            <p><strong>ID:</strong> <span id="pokemonId"></span></p>
            <p><strong>Tipos:</strong> <span id="pokemonTypes"></span></p>
            <p><strong>Altura:</strong> <span id="pokemonHeight"></span> m</p>
            <p><strong>Peso:</strong> <span id="pokemonWeight"></span> kg</p>
          </div>

          <div class="abilities">
            <h3>Habilidades:</h3>
            <ul id="pokemonAbilities"></ul>
          </div>

          <div class="stats">
            <h3>Estadísticas:</h3>
            <div id="pokemonStats"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER CONTAINER - Se carga automáticamente -->
    <div id="footer-container"></div>

    <script src="pokemon-script.js"></script>
    <script src="../js/load-footer.js"></script>
  </body>
</html>
