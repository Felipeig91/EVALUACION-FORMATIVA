<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex con jQuery</title>
    <link rel="stylesheet" href="pokemon-style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Pokédex</h1>

      <div class="search-section">
        <input
          type="text"
          id="pokemonInput"
          placeholder="Busca un Pokémon por nombre o ID..."
        />
        <button id="searchBtn">Buscar</button>
      </div>

      <div id="error" class="error"></div>

      <div id="loading" class="loading" style="display: none">Cargando...</div>

      <div id="pokemonCard" class="pokemon-card" style="display: none">
        <div class="card-content">
          <img id="pokemonImage" src="" alt="Pokémon" />
          <h2 id="pokemonName"></h2>

          <div class="pokemon-info">
            <p><strong>ID:</strong> <span id="pokemonId"></span></p>
            <p><strong>Tipos:</strong> <span id="pokemonTypes"></span></p>
            <p><strong>Altura:</strong> <span id="pokemonHeight"></span> m</p>
            <p><strong>Peso:</strong> <span id="pokemonWeight"></span> kg</p>
          </div>

          <div class="abilities">
            <h3>Habilidades:</h3>
            <ul id="pokemonAbilities"></ul>
          </div>

          <div class="stats">
            <h3>Estadísticas:</h3>
            <div id="pokemonStats"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="pokemon-script.js"></script>
  </body>
</html>
